name: 14-Artifact-Download 

on: 
  push:
    branches:
    - main 

jobs: 
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: app
        path: demo.txt

    - name: Download artifact
      uses: actions/download-artifact@v4 
      with: 
        name: app
    
    - name: Verify file
      run: cat demo.txt