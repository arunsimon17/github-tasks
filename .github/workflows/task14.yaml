name: Artifact-Flow

on:
  push:
    branches: 
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "data" > file.txt

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: file.txt

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app

      - run: cat file.txt